<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTap Kitchen Display</title>
<link rel="stylesheet" href="../css/kitchen.css?v=3">
<body>
    <div class="kds-app">
        <header class="kds-topbar">
            <div class="kds-brand">
                <div class="kds-logo" id="kitchenLogo">TT</div>
                <div>
                    <strong id="kitchenRestaurantName">TableTap</strong>
                    <small>Kitchen Display System</small>
                </div>
            </div>
            <div class="kds-topbar-actions">
                <div class="kds-live-status"><span></span>Live orders</div>
                <div class="kds-date-time">
                    <strong id="kitchenCurrentTime">--:--</strong>
                    <small id="kitchenCurrentDate">Today</small>
                </div>
                <button class="kds-fullscreen-button" id="kitchenFullscreenButton" type="button">Full Screen</button>
            </div>
        </header>

        <main class="kds-main">
            <section class="kds-summary-grid" aria-label="Kitchen order summary">
                <article class="kds-summary-card kds-summary-new"><small>New</small><strong id="kitchenNewCount">0</strong><p>Waiting to start</p></article>
                <article class="kds-summary-card kds-summary-preparing"><small>Preparing</small><strong id="kitchenPreparingCount">0</strong><p>Currently cooking</p></article>
                <article class="kds-summary-card kds-summary-ready"><small>Ready</small><strong id="kitchenReadyCount">0</strong><p>Waiting to serve</p></article>
                <article class="kds-summary-card"><small>Completed Today</small><strong id="kitchenCompletedCount">0</strong><p>Finished orders</p></article>
                <article class="kds-summary-card"><small>Average Time</small><strong id="kitchenAverageTime">0 min</strong><p>Preparation duration</p></article>
            </section>

            <section class="kds-toolbar">
                <label class="kds-search-control" for="kitchenSearch"><span>⌕</span><input id="kitchenSearch" type="search" placeholder="Search order, customer or table" autocomplete="off"></label>
                <select id="kitchenOrderTypeFilter" aria-label="Filter kitchen orders">
                    <option value="all">All Orders</option>
                    <option value="dine-in">Dine In</option>
                    <option value="takeaway">Takeaway</option>
                    <option value="delivery">Delivery</option>
                </select>
                <select id="kitchenSortOrder" aria-label="Sort kitchen orders">
                    <option value="oldest">Oldest First</option>
                    <option value="newest">Newest First</option>
                    <option value="urgent">Most Delayed</option>
                </select>
                <label class="kds-sound-toggle"><input id="kitchenSoundToggle" type="checkbox" checked><span>Sound alerts</span></label>
            </section>

            <section class="kds-board" aria-label="Kitchen order board">
                <article class="kds-column kds-column-new"><header><div><span class="kds-column-dot"></span><h2>New Orders</h2></div><strong id="kitchenNewColumnCount">0</strong></header><div class="kds-column-body" id="kitchenNewOrders"></div></article>
                <article class="kds-column kds-column-preparing"><header><div><span class="kds-column-dot"></span><h2>Preparing</h2></div><strong id="kitchenPreparingColumnCount">0</strong></header><div class="kds-column-body" id="kitchenPreparingOrders"></div></article>
                <article class="kds-column kds-column-ready"><header><div><span class="kds-column-dot"></span><h2>Ready</h2></div><strong id="kitchenReadyColumnCount">0</strong></header><div class="kds-column-body" id="kitchenReadyOrders"></div></article>
                <article class="kds-column kds-column-completed"><header><div><span class="kds-column-dot"></span><h2>Completed</h2></div><strong id="kitchenCompletedColumnCount">0</strong></header><div class="kds-column-body" id="kitchenCompletedOrders"></div></article>
            </section>
        </main>

        <div class="kds-toast" id="kitchenToast" aria-live="polite"></div>
    </div>
    <script src="../js/kitchen.js?v=2"></script>
</body>
</html>
