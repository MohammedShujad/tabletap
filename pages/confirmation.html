<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Your Order</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f5ef;
            color: #2f2f2f;
        }

        .page-header {
            background: #8b1014;
            color: white;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .tracking-card {
            width: 90%;
            max-width: 700px;
            margin: 45px auto;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .checkmark {
            text-align: center;
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            color: #8b1014;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .order-number {
            background: #faf7f2;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .tracking-steps {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tracking-step {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px;
            background: #f3f3f3;
            border-radius: 12px;
            color: #777;
            font-weight: bold;
        }

        .tracking-step.active {
            background: #fff2cf;
            color: #8b1014;
            border: 1px solid #d4af37;
        }

        .tracking-step.complete {
            background: #e8f7ed;
            color: #237944;
        }

        .step-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: white;
            flex-shrink: 0;
        }

        .refresh-note {
            text-align: center;
            color: #777;
            margin-top: 25px;
            font-size: 14px;
        }

        .action-button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #8b1014;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .secondary-button {
            background: white;
            color: #8b1014;
            border: 1px solid #8b1014;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="page-header">
        <div id="confirmationRestaurantLogo">
            🍽️
        </div>

        <div id="confirmationRestaurantName">
            Restaurant
        </div>
    </div>

    <main class="tracking-card">

        <div class="checkmark">
            ✅
        </div>

        <h1>
            Order Confirmed
        </h1>

        <p class="subtitle">
            Track the progress of your order below.
        </p>

        <div
            id="orderNumber"
            class="order-number"
        ></div>

        <section class="tracking-steps">

            <div
                id="stepNew"
                class="tracking-step"
            >
                <div class="step-icon">
                    🕒
                </div>

                <span>
                    Waiting for Restaurant
                </span>
            </div>

            <div
                id="stepAccepted"
                class="tracking-step"
            >
                <div class="step-icon">
                    👍
                </div>

                <span>
                    Order Accepted
                </span>
            </div>

            <div
                id="stepPreparing"
                class="tracking-step"
            >
                <div class="step-icon">
                    🍳
                </div>

                <span>
                    Preparing Your Food
                </span>
            </div>

            <div
                id="stepReady"
                class="tracking-step"
            >
                <div class="step-icon">
                    ✅
                </div>

                <span>
                    Ready to Serve
                </span>
            </div>

        </section>

        <p class="refresh-note">
            Your order status updates automatically.
        </p>

        <button
            id="refreshStatus"
            class="action-button"
            type="button"
        >
            Refresh Status
        </button>

        <button
            class="action-button secondary-button"
            type="button"
            onclick="window.location.href='menu.html'"
        >
            Order More
        </button>

    </main>

    <script src="../js/shared-order-sync.js?v=1"></script>

    <script>
        const savedSettings =
            JSON.parse(
                localStorage.getItem(
                    "tableTapSettings"
                )
            ) || {};

        const confirmationRestaurantName =
            document.getElementById(
                "confirmationRestaurantName"
            );

        const confirmationRestaurantLogo =
            document.getElementById(
                "confirmationRestaurantLogo"
            );

        const restaurantName =
            savedSettings.restaurantName ||
            "Green & Red Restaurant";

        confirmationRestaurantName.textContent =
            restaurantName;

        document.title =
            `${restaurantName} Order Tracking`;

        if (savedSettings.logoUrl) {
            confirmationRestaurantLogo.innerHTML = `
                <img
                    src="${savedSettings.logoUrl}"
                    alt="${restaurantName} logo"
                    style="
                        width: 42px;
                        height: 42px;
                        object-fit: cover;
                        border-radius: 10px;
                        vertical-align: middle;
                    "
                >
            `;
        }

        const stepNew =
            document.getElementById(
                "stepNew"
            );

        const stepAccepted =
            document.getElementById(
                "stepAccepted"
            );

        const stepPreparing =
            document.getElementById(
                "stepPreparing"
            );

        const stepReady =
            document.getElementById(
                "stepReady"
            );

        const orderNumberElement =
            document.getElementById(
                "orderNumber"
            );

        function getTrackedOrderId() {
            try {
                const latestOrder =
                    JSON.parse(
                        localStorage.getItem(
                            "tableTapLatestOrder"
                        )
                    );

                return latestOrder?.id || null;
            } catch (error) {
                console.error(
                    "Unable to read latest order:",
                    error
                );

                return null;
            }
        }

        function normalizeTrackingStatus(status) {
            const value =
                String(status || "New")
                    .trim()
                    .toLowerCase();

            if (
                value === "pending" ||
                value === "placed" ||
                value === "submitted" ||
                value === "waiting" ||
                value === "new"
            ) {
                return "New";
            }

            if (value === "accepted") {
                return "Accepted";
            }

            if (value === "preparing") {
                return "Preparing";
            }

            if (value === "ready") {
                return "Ready";
            }

            if (
                value === "served" ||
                value === "completed"
            ) {
                return "Completed";
            }

            return "New";
        }

        function updateTrackingSteps(status) {
            const normalizedStatus =
                normalizeTrackingStatus(
                    status
                );

            const steps = [
                stepNew,
                stepAccepted,
                stepPreparing,
                stepReady
            ];

            const statusIndexes = {
                New: 0,
                Accepted: 1,
                Preparing: 2,
                Ready: 3,
                Completed: 4
            };

            const currentIndex =
                statusIndexes[
                    normalizedStatus
                ] ?? 0;

            steps.forEach(
                function (step, index) {
                    step.classList.remove(
                        "active",
                        "complete"
                    );

                    if (
                        currentIndex >=
                        steps.length
                    ) {
                        step.classList.add(
                            "complete"
                        );

                        return;
                    }

                    if (index < currentIndex) {
                        step.classList.add(
                            "complete"
                        );
                    }

                    if (index === currentIndex) {
                        step.classList.add(
                            "active"
                        );
                    }
                }
            );

            const readyText =
                stepReady.querySelector(
                    "span"
                );

            if (
                normalizedStatus ===
                "Completed"
            ) {
                readyText.textContent =
                    "Order Served Successfully";
            } else {
                readyText.textContent =
                    "Ready to Serve";
            }
        }

        function loadOrderStatus() {
            if (!window.TableTapOrderSync) {
                orderNumberElement.textContent =
                    "Order sync unavailable";

                return;
            }

            const trackedOrderId =
                getTrackedOrderId();

            if (!trackedOrderId) {
                orderNumberElement.textContent =
                    "Order information unavailable";

                return;
            }

            const currentOrder =
                TableTapOrderSync.getOrderById(
                    trackedOrderId
                );

            if (!currentOrder) {
                orderNumberElement.textContent =
                    `Order Number: ${trackedOrderId}`;

                updateTrackingSteps(
                    "New"
                );

                return;
            }

            orderNumberElement.textContent =
                `Order Number: ${currentOrder.id}`;

            updateTrackingSteps(
                currentOrder.status
            );
        }

        document
            .getElementById(
                "refreshStatus"
            )
            .addEventListener(
                "click",
                loadOrderStatus
            );

        if (window.TableTapOrderSync) {
            TableTapOrderSync.subscribe(
                function (orders) {
                    const trackedOrderId =
                        getTrackedOrderId();

                    if (!trackedOrderId) {
                        return;
                    }

                    const updatedOrder =
                        orders.find(
                            function (order) {
                                return (
                                    String(
                                        order.id
                                    ) ===
                                    String(
                                        trackedOrderId
                                    )
                                );
                            }
                        );

                    if (!updatedOrder) {
                        return;
                    }

                    orderNumberElement.textContent =
                        `Order Number: ${updatedOrder.id}`;

                    updateTrackingSteps(
                        updatedOrder.status
                    );
                }
            );
        }

        loadOrderStatus();
    </script>

</body>

</html>
