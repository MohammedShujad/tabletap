<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TableTap Login</title>

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            🍽️

        </div>

        <h1>TableTap</h1>

        <p>
            Restaurant Management System
        </p>

        <form id="loginForm">

            <input
                id="username"
                type="text"
                placeholder="Username"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
            >
                Login
            </button>

        </form>

        <div
            id="loginMessage"
            class="message"
        ></div>

        <div class="demo-users">

            <h3>Demo Accounts</h3>

            <small>

Owner :
owner / 1234

<br><br>

Manager :
manager / 1234

<br><br>

Kitchen :
kitchen / 1234

<br><br>

Waiter :
waiter / 1234

<br><br>

Cashier :
cashier / 1234

            </small>

        </div>

    </div>

</div>

<script src="../js/auth.js"></script>

<script src="../js/login.js"></script>

</body>

</html>
